- id: multi-tethered-aerial-robots
  topic: Collaborative aerial robotics
  title: "Multi-Tethered Aerial Robot System for Precise Aerial Physical Collaborative Interaction"
  authors: "Jiangcheng Su, Qingyang Meng, Haoyang Yang, Xiaozhen Zhang, and Hailong Huang"
  venue: "IEEE Transactions on Consumer Electronics"
  year: 2026
  paper_url: "https://doi.org/10.1109/TCE.2026.3736711"
  # Summary paraphrased from the publisher's abstract:
  # https://ieeexplore.ieee.org/abstract/document/11703665
  summary: >-
    We present a collaborative aerial robot system in which two tethered
    quadrotors jointly manipulate a bar payload for aerial physical interaction.
    A Lagrangian model describes the system dynamics, while a computed-torque
    controller with an extended state observer guides the payload along its
    reference trajectory. Physical experiments demonstrate precise interaction
    with payload position errors below 5 cm.
  images:
    - src: "/images/research/multi-tethered-interaction-results.png"
      width: 1314
      height: 1026
      alt: "Five-panel figure showing the 3D trajectory of two tethered quadrotors and their bar payload, longitudinal swing tracking, lateral sway regulation, payload yaw control, and thrust commands during aerial physical interaction."
      caption: "Trajectory and control responses during aerial physical interaction: (a) 3D spatial trajectory; (b–d) longitudinal swing, lateral sway, and payload yaw; (e) thrust commands for the two quadrotors. Click the figure to view it at full size."
  video:
    src: "/files/videos/multi-tethered-aerial-robot.mp4"
    poster: "/images/research/multi-tethered-video-poster.jpg"
    bvid: "BV14CHf6eEHx"
    youtube_url: "https://www.youtube.com/watch?v=hzQJZNNohic"
    caption: "Experimental demonstration of the collaborative aerial robot system."

